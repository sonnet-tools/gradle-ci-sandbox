name: perm-probe
on: pull_request
permissions: write-all
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      contents: write
      deployments: write
      id-token: write
      issues: write
      packages: write
      pages: write
      pull-requests: write
      repository-projects: write
      security-events: write
      statuses: write
    steps:
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          echo "EVENT=$GITHUB_EVENT_NAME REF=$GITHUB_REF HEAD_REPO=${{ github.event.pull_request.head.repo.full_name }}"
          echo "SECRETS_PRESENT=${{ secrets.PROBE_SECRET != '' }}"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ID_TOKEN_URL=set"
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe")
            echo "OIDC_HTTP=$code"
          else
            echo "ID_TOKEN_URL=unset"
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/labels" -d '{"name":"perm-probe-'"$GITHUB_RUN_ID"'"}')
          echo "LABEL_CREATE_HTTP=$code"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO")
          echo "REPO_READ_HTTP=$code"
